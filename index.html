<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#2f7d4a">
  <title>岡沢 ごみ出しナビ</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app">
    <div id="home-view">
      <header>
        <h1>岡沢 ごみ出しナビ</h1>
        <p>上越市 中郷区 C地区</p>
      </header>

      <section class="today-card" aria-labelledby="today-title">
        <h2 id="today-title">今日のごみ</h2>
        <p>収集情報を読み込みます</p>
      </section>

      <section class="next-card" aria-labelledby="next-title">
        <h2 id="next-title">次の収集</h2>
        <p>次回の収集情報を読み込みます</p>
      </section>

      <nav aria-label="メインメニュー">
        <button type="button" data-view="week">今週の予定</button>
        <button type="button" data-view="calendar">カレンダー</button>
      </nav>
    </div>

    <div id="week-view" class="view" hidden>
      <header class="sub-header">
        <button type="button" class="back-button" data-view="home" aria-label="ホームに戻る">←</button>
        <div>
          <h1>今週の予定</h1>
          <p id="week-range"></p>
        </div>
      </header>
      <div id="week-list" class="week-list"></div>
      <p class="source-note">実際の収集日は年度カレンダーを優先</p>
    </div>

    <div id="calendar-view" class="view" hidden>
      <header class="sub-header">
        <button type="button" class="back-button" data-view="home" aria-label="ホームに戻る">←</button>
        <div>
          <h1>カレンダー</h1>
          <p id="calendar-month"></p>
        </div>
      </header>
      <div class="calendar-weekdays" aria-hidden="true">
        <span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span>土</span><span>日</span>
      </div>
      <div id="calendar-grid" class="calendar-grid"></div>
      <div class="legend" aria-label="ごみ種別の色分け">
        <span class="legend-item burnable">燃・生</span>
        <span class="legend-item packaging">容器</span>
        <span class="legend-item cans">缶びん</span>
        <span class="legend-item paper">古紙</span>
        <span class="legend-item nonburnable">不燃</span>
      </div>
      <p class="source-note">実際の収集日は年度カレンダーを優先</p>
    </div>
  </main>
  <script src="schedule-2026.js"></script>
  <script src="app.js"></script>
</body>
</html>
